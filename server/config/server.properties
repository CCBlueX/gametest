# The game test server. The container copies it over its own on every start.
server-port=25565
motd=LiquidBounce automated game test server

# Bots connect directly in offline mode or through a proxy that checked them. Behind a proxy, turn on
# settings.bungeecord in spigot.yml and keep the server's port unreachable from anywhere else.
online-mode=false
enforce-secure-profile=false
white-list=false
prevent-proxy-connections=false
network-compression-threshold=-1
accepts-transfers=false
log-ips=false
hide-online-players=true
max-players=40

# The main world is the lobby: a void. Every session gets worlds of its own from the gametest plugin.
level-name=world
level-type=minecraft\:flat
generator-settings={"biome"\:"minecraft\:the_void","layers"\:[{"block"\:"minecraft\:air","height"\:1}]}
generate-structures=false
level-seed=lobby
difficulty=peaceful
gamemode=adventure
force-gamemode=false
spawn-protection=0
view-distance=4
simulation-distance=4

player-idle-timeout=0
# Sessions end on timers that only run while the server ticks
pause-when-empty-seconds=-1
sync-chunk-writes=false
enable-query=false
enable-rcon=false
management-server-enabled=false
